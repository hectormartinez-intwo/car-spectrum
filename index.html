<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Car Spectrum</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#cfd6e4;font-family:system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:rgba(5,6,10,.92);z-index:5;text-align:center;padding:24px}
  #start h1{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:.04em}
  #start p{margin:0;max-width:640px;opacity:.7;font-size:clamp(14px,2vw,20px);line-height:1.4}
  button{font:inherit;color:#fff;background:#1f6feb;border:0;border-radius:14px;padding:18px 34px;font-size:clamp(18px,3vw,28px);cursor:pointer}
  button.alt{background:#2a2f3d}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:4;transition:opacity .4s}
  #bar.hide{opacity:0;pointer-events:none}
  #bar label{display:flex;align-items:center;gap:8px;font-size:18px}
  #bar button{padding:10px 18px;font-size:18px}
  input[type=range]{width:160px;height:28px}
  #msg{position:fixed;top:10px;left:0;right:0;text-align:center;font-size:18px;color:#ffb86b;z-index:6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<div id="start">
  <h1>SPECTRUM</h1>
  <p>Plays along with your music. Tap Start and allow the microphone so it can hear the sound in the car.</p>
  <button id="go">Start with microphone</button>
  <button id="demo" class="alt">Demo (no mic)</button>
</div>
<div id="bar" class="hide">
  <label>Gain <input id="gain" type="range" min="0.5" max="6" step="0.1" value="2.5"></label>
  <label>Bars <input id="bars" type="range" min="16" max="96" step="8" value="48"></label>
  <button id="style" class="alt">Style</button>
  <button id="full" class="alt">Fullscreen</button>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
addEventListener('resize',resize);resize();

let audioCtx,analyser,freq,mode='mic',t0=performance.now();
let nBars=48,styleIdx=0,vals=[],peaks=[],bass=0,bassAvg=0,flash=0;
const styles=['bars','mirror','radial'];
const FFT=4096;

async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=FFT;analyser.smoothingTimeConstant=0.6;
    src.connect(analyser);freq=new Uint8Array(analyser.frequencyBinCount);
    mode='mic';begin();
  }catch(e){
    $('msg').textContent='Microphone unavailable: '+(e.name||e.message)+'. Try Demo, or check mic permission / HTTPS.';
    $('start').style.display='flex';
  }
}
function begin(){
  $('start').style.display='none';$('bar').classList.remove('hide');hideLater();
  try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(_){}
}
$('go').onclick=startMic;
$('demo').onclick=()=>{mode='demo';begin()};

function demoSpectrum(n){
  const t=(performance.now()-t0)/1000,beat=(t*2)%1,kick=Math.pow(1-beat,4);
  const out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=i/n;
    let v=kick*Math.exp(-x*5)*1.0 + 0.35*Math.exp(-x*2)*(0.5+0.5*Math.sin(t*1.3+i*.4));
    v+=0.25*(0.5+0.5*Math.sin(t*5+i*.7))*(1-x)*((Math.floor(t*4)%2)?1:.4);
    v+=0.08*Math.random();out[i]=Math.max(0,Math.min(1,v));
  }
  return out;
}
function micSpectrum(n){
  analyser.getByteFrequencyData(freq);
  const g=parseFloat($('gain').value),sr=audioCtx.sampleRate,binHz=sr/FFT;
  const lo=30,hi=Math.min(16000,sr/2);
  const out=new Float32Array(n);
  for(let i=0;i<n;i++){
    const f1=lo*Math.pow(hi/lo,i/n),f2=lo*Math.pow(hi/lo,(i+1)/n);
    let b1=Math.floor(f1/binHz),b2=Math.max(b1+1,Math.ceil(f2/binHz)),s=0,c=0,m=0;
    for(let b=b1;b<b2&&b<freq.length;b++){s+=freq[b];c++;if(freq[b]>m)m=freq[b]}
    let v=(c?(s/c*0.4+m*0.6):0)/255;
    v*= 0.8+0.9*(i/n); // gentle tilt so highs are visible
    out[i]=Math.max(0,Math.min(1,Math.pow(v,1.4)*g));
  }
  return out;
}

function hue(i,n){return 200+ (i/n)*160}
function draw(){
  requestAnimationFrame(draw);
  if(!(mode==='demo'||analyser))return;
  const n=nBars,s=mode==='demo'?demoSpectrum(n):micSpectrum(n);
  if(vals.length!==n){vals=new Array(n).fill(0);peaks=new Array(n).fill(0)}
  let bsum=0,bc=Math.max(2,Math.round(n*0.1));
  for(let i=0;i<n;i++){
    const tgt=s[i];
    vals[i]=tgt>vals[i]?vals[i]+(tgt-vals[i])*0.7:vals[i]+(tgt-vals[i])*0.18;
    peaks[i]=Math.max(vals[i],peaks[i]-0.006);
    if(i<bc)bsum+=vals[i];
  }
  bass=bsum/bc;bassAvg=bassAvg*0.92+bass*0.08;
  if(bass>bassAvg*1.25&&bass>0.25)flash=1;flash*=0.9;

  ctx.fillStyle='rgba(5,6,10,0.35)';ctx.fillRect(0,0,W,H);
  // beat glow
  const gr=ctx.createRadialGradient(W/2,H*0.6,0,W/2,H*0.6,Math.max(W,H)*0.6);
  gr.addColorStop(0,`hsla(260,90%,55%,${0.05+flash*0.25})`);gr.addColorStop(1,'transparent');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);

  const st=styles[styleIdx];
  if(st==='radial')return drawRadial(n);
  const gap=W*0.004,bw=(W-gap*(n+1))/n,base=st==='mirror'?H*0.5:H*0.92,maxH=st==='mirror'?H*0.4:H*0.8;
  for(let i=0;i<n;i++){
    const x=gap+i*(bw+gap),h=Math.max(2*dpr,vals[i]*maxH),hh=hue(i,n);
    const g=ctx.createLinearGradient(0,base-h,0,base);
    g.addColorStop(0,`hsl(${hh},95%,65%)`);g.addColorStop(1,`hsl(${hh+30},90%,45%)`);
    ctx.fillStyle=g;ctx.shadowColor=`hsl(${hh},100%,60%)`;ctx.shadowBlur=(8+flash*18)*dpr;
    ctx.fillRect(x,base-h,bw,h);
    if(st==='mirror')ctx.fillRect(x,base,bw,h*0.9);
    ctx.shadowBlur=0;ctx.fillStyle='#fff';
    const ph=peaks[i]*maxH;ctx.fillRect(x,base-ph-4*dpr,bw,3*dpr);
    if(st==='mirror')ctx.fillRect(x,base+ph*0.9+dpr,bw,3*dpr);
  }
}
function drawRadial(n){
  const cx=W/2,cy=H/2,r0=Math.min(W,H)*(0.2+flash*0.03),rm=Math.min(W,H)*0.3;
  ctx.lineWidth=Math.max(2,(Math.PI*2*r0/n)*0.6);ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2-Math.PI/2,l=vals[i]*rm+4*dpr;
    ctx.strokeStyle=`hsl(${hue(i,n)},95%,62%)`;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=(8+flash*18)*dpr;
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*(r0+l),cy+Math.sin(a)*(r0+l));ctx.stroke();
  }
  ctx.shadowBlur=0;
}
draw();

$('bars').oninput=e=>{nBars=+e.target.value;vals=[];peaks=[]};
$('style').onclick=()=>{styleIdx=(styleIdx+1)%styles.length;ctx.clearRect(0,0,W,H)};
$('full').onclick=()=>{const d=document.documentElement;document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen&&d.requestFullscreen())};
let hideT;function hideLater(){clearTimeout(hideT);$('bar').classList.remove('hide');hideT=setTimeout(()=>$('bar').classList.add('hide'),5000)}
['pointerdown','pointermove','keydown'].forEach(ev=>addEventListener(ev,()=>{if($('start').style.display!=='flex')hideLater()}));
addEventListener('visibilitychange',()=>{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()});
})();
</script>
</body>
</html>
